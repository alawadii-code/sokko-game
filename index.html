<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="لعبة كرتونية مضحكة للأطفال: الجورب سوكو يواجه ثلاثة وحوش عشان ينقذ أخوه لوكو.">
<title>سوكو وسرقة الجوارب الكبرى</title>
<style>
:root{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@400;600;700&display=swap">
<style>
/* Layout: one old cinema screen centered in a dark theater; touch pads pinned to the bottom corners. */
:root{
  --theater:#120d0a; --curtain:#4a1512; --curtain-fold:#2c0c0a;
  --paper:#f1e3c2; --ink:#1b1410; --mustard:#e0a63a; --red:#c8432f; --teal:#3f8f8a;
  --display:'Lalezar','Tahoma','Arial',sans-serif;
  --body:'Baloo Bhaijaan 2','Tahoma','Arial',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:
    repeating-linear-gradient(90deg,var(--curtain) 0 26px,var(--curtain-fold) 26px 44px) left/9% 100% no-repeat,
    repeating-linear-gradient(90deg,var(--curtain-fold) 0 18px,var(--curtain) 18px 44px) right/9% 100% no-repeat,
    var(--theater);
  color:var(--paper); font-family:var(--body); overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.theater{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-inline:16px;padding-block:10px}
.screen{position:relative;line-height:0;border-radius:14px;box-shadow:0 0 0 4px var(--ink),0 0 0 7px var(--mustard),0 18px 50px rgba(0,0,0,.7)}
canvas{display:block;border-radius:14px;touch-action:none;background:var(--ink)}
#mute{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);color:var(--ink);font:600 12px var(--body);cursor:pointer;opacity:.85;line-height:1;padding:0}
#mute:hover{opacity:1}
#lang{position:absolute;top:8px;left:8px;height:38px;padding:0 14px;border-radius:19px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);font:700 15px var(--body);cursor:pointer;opacity:.9;line-height:1}
#lang:hover{opacity:1}
#help{margin:0;font-size:16px;line-height:1.9;text-align:center;color:var(--paper);opacity:.9;max-width:100%}
#help kbd{font:600 13px var(--body);background:var(--paper);color:var(--ink);border-radius:6px;padding:2px 7px;margin-inline:2px;box-shadow:0 2px 0 var(--mustard);white-space:nowrap}
#help span{white-space:nowrap;margin-inline:6px}
.pads{position:fixed;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.pads div{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.pads button{touch-action:none;width:68px;height:68px;border-radius:50%;border:4px solid var(--ink);background:var(--paper);color:var(--ink);font:400 22px var(--display);opacity:.82;box-shadow:0 5px 0 var(--ink);padding:0}
.pads .pr{display:grid;grid-template-columns:auto auto;justify-items:center;align-items:end}
.pads button.small{width:58px;height:58px;font-size:14px}
.pads button.shoot{width:76px;height:76px;font-size:19px;background:#c4d277}
.pads button.big{width:84px;height:84px;font-size:21px;background:var(--mustard)}
.pads button.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);opacity:1}
.pads button.ready{background:#b9c96a;animation:wig .5s infinite alternate}
button:focus-visible{outline:3px solid var(--mustard);outline-offset:3px}
@keyframes wig{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.pads button.ready{animation:none}}
</style>

</head>
<body>
<div class="theater" id="theater" lang="ar">
  <div class="screen">
    <canvas id="game" width="960" height="540" aria-label="لعبة سوكو وسرقة الجوارب الكبرى: معارك كرتونية مضحكة"></canvas>
    <button id="mute" type="button" aria-label="تشغيل الصوت أو إيقافه">♪</button>
    <button id="lang" type="button" aria-label="تغيير اللغة">اللغة: مصري</button>
  </div>
  <p id="help" dir="rtl">
    <span><kbd>←</kbd><kbd>→</kbd> للحركة</span>
    <span><kbd>Space</kbd> للقفز</span>
    <span><kbd>X</kbd> لإطلاق الرائحة (اضغط باستمرار)</span>
    <span><kbd>Shift</kbd> للاندفاع</span>
    <span><kbd>C</kbd> للرائحة الخارقة</span>
  </p>
</div>
<div class="pads" id="pads" lang="ar" hidden>
  <div><button type="button" data-k="left" aria-label="تحرك لليسار">◀</button><button type="button" data-k="right" aria-label="تحرك لليمين">▶</button></div>
  <div class="pr"><button type="button" data-k="super" id="btnSuper" class="small">خارقة</button><button type="button" data-k="dash" class="small">اندفاع</button><button type="button" data-k="shoot" class="shoot">أطلق</button><button type="button" data-k="jump" class="big">اقفز</button></div>
</div>

<script>
(()=>{'use strict';
const W=960,H=540,GY=440;
const INK='#1b1410',PAPER='#f1e3c2',RED='#c8432f',TEAL='#3f8f8a',MUST='#e0a63a',GREEN='#7da453',DKGREEN='#4d7a3d',
      PINK='#e79a8a',BLUE='#5b86a8',PURPLE='#7a5c8e',CREAM='#f7edd2',BROWN='#7a4a2a',WHITE='#fffaf0',STINK='#c4d277';
const FD="'Lalezar','Tahoma','Arial',sans-serif",FB="'Baloo Bhaijaan 2','Tahoma','Arial',sans-serif";
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
try{document.documentElement.lang='ar'}catch(e){}
const cv=document.getElementById('game');let ctx=cv.getContext('2d');const main=ctx;
const padsEl=document.getElementById('pads'),helpEl=document.getElementById('help'),btnSuper=document.getElementById('btnSuper');
let S=1,t=0,tq=0,boil=0,isTouch=window.matchMedia&&matchMedia('(pointer: coarse)').matches;

/* ---------- small helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[(Math.random()*a.length)|0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
const bj=(i,a=1.3)=>(hash(boil*13.7+i*5.3)-.5)*2*a;            // "line boil" jitter, changes 8x a second
let seed=7;function sr(){seed=(seed*16807)%2147483647;return seed/2147483647}
function circRect(cx,cy,r,b){const nx=clamp(cx,b.x,b.x+b.w),ny=clamp(cy,b.y,b.y+b.h);return (cx-nx)**2+(cy-ny)**2<r*r}
function rectRect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

/* ---------- ink-and-paint drawing kit ---------- */
function ell(x,y,rx,ry,fill,lw=5,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,7);if(fill){ctx.fillStyle=fill;ctx.fill()}if(lw){ctx.lineWidth=lw;ctx.strokeStyle=INK;ctx.stroke()}}
function rrPath(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function rr(x,y,w,h,r,fill,lw=5){ctx.beginPath();rrPath(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(lw){ctx.lineWidth=lw;ctx.strokeStyle=INK;ctx.stroke()}}
function hose(x1,y1,cx,cy,x2,y2,w=6){ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.strokeStyle=INK;ctx.lineWidth=w;ctx.stroke()}
function line(x1,y1,x2,y2,w=4,col=INK){ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke()}
function poly(pts,fill,lw=5){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();ctx.lineJoin='round';if(fill){ctx.fillStyle=fill;ctx.fill()}if(lw){ctx.lineWidth=lw;ctx.strokeStyle=INK;ctx.stroke()}}
function glove(x,y,r=11){ell(x,y,r,r*.92,CREAM,4);ctx.lineWidth=2.2;ctx.strokeStyle=INK;ctx.beginPath();for(const i of[-1,0,1]){ctx.moveTo(x+i*r*.36,y-r*.5);ctx.lineTo(x+i*r*.36,y+r*.05)}ctx.stroke()}
function shoe(x,y,dir=1,s=1){ell(x+dir*7*s,y-7*s,17*s,9*s,BROWN,4);ctx.beginPath();ctx.arc(x+dir*12*s,y-9*s,5*s,3.6,5.2);ctx.strokeStyle='rgba(255,250,240,.6)';ctx.lineWidth=2;ctx.stroke()}
function pieEye(x,y,rx,ry,ang=0,closed=false){
  if(closed){ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.lineCap='round';ctx.beginPath();ctx.arc(x,y-rx*.3,rx,.15*Math.PI,.85*Math.PI);ctx.stroke();return}
  ell(x,y,rx,ry,WHITE,3.5);
  const px=x+Math.cos(ang)*rx*.32,py=y+Math.sin(ang)*ry*.3+ry*.12,pr=rx*.55,pry=ry*.58;
  ctx.fillStyle=INK;ctx.beginPath();ctx.ellipse(px,py,pr,pry,0,0,7);ctx.fill();
  ctx.fillStyle=WHITE;ctx.beginPath();ctx.moveTo(px,py);ctx.arc(px,py,Math.min(pr,pry)*1.05,-1.2,-.45);ctx.closePath();ctx.fill();
}
function dizzy(x,y,r){ell(x,y,r,r,WHITE,3.5);ctx.beginPath();for(let a=0;a<11;a+=.3){const q=a/11*r*.8;ctx.lineTo(x+Math.cos(a+t*6)*q,y+Math.sin(a+t*6)*q)}ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.stroke()}
function heart(x,y,s,fill){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.6,y-s*1.15,x,y-s*.35);ctx.bezierCurveTo(x+s*.6,y-s*1.15,x+s*1.5,y-s*.1,x,y+s*.9);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.stroke()}
function label(txt,x,y,size,fill=PAPER,o={}){
  ctx.save();ctx.direction='rtl';ctx.font=`${o.w||400} ${size}px ${o.body?FB:FD}`;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.lineJoin='round';
  ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);
  if(o.stroke!==0){ctx.strokeStyle=INK;ctx.lineWidth=o.stroke||Math.max(4,size*.24);if(o.sh){ctx.strokeText(txt,o.sh,o.sh);ctx.fillStyle=INK;ctx.fillText(txt,o.sh,o.sh)}ctx.strokeText(txt,0,0)}
  ctx.fillStyle=fill;ctx.fillText(txt,0,0);ctx.restore();
}
function wrap(text,maxW){const out=[];for(const para of text.split('\n')){let cur='';for(const w of para.split(' ')){const tst=cur?cur+' '+w:w;if(ctx.measureText(tst).width>maxW&&cur){out.push(cur);cur=w}else cur=tst}out.push(cur)}return out}
function sunburst(cx,cy,R,n,rot,c1,c2){ctx.fillStyle=c1;ctx.fillRect(0,0,W,H);ctx.fillStyle=c2;for(let i=0;i<n;i++){const a=rot+i*Math.PI*2/n;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a,a+Math.PI/n);ctx.closePath();ctx.fill()}}
function cloud(x,y,s){for(const[a,b,r]of[[-34,6,22],[-8,-8,28],[22,-2,24],[44,8,17]])ell(x+a*s,y+b*s,r*s,r*s*.8,CREAM,4);ctx.fillStyle=CREAM;ctx.fillRect(x-40*s,y+2*s,90*s,14*s);line(x-48*s,y+17*s,x+56*s,y+17*s,4)}

/* ---------- characters (all original) ---------- */
function drawSock(x,y,sc,o={}){
  const col=o.col||RED,face=o.face||1,b=o.air?0:Math.sin(tq*9+(o.ph||0))*2.5;
  ctx.save();ctx.translate(x+bj(11+(o.ph||0),.8)+(o.scared?Math.sin(t*45)*1.4:0),y);ctx.scale(sc*face,sc);
  let f1x=-9,f1y=0,f2x=12,f2y=0;const ph=(o.runT||0)*16;
  if(o.air){f1x=-15;f1y=-12;f2x=16;f2y=-5}
  else if(o.run){f1x=-9+Math.sin(ph)*16;f1y=-Math.max(0,Math.cos(ph))*11;f2x=12-Math.sin(ph)*16;f2y=-Math.max(0,-Math.cos(ph))*11}
  hose(-7,-24+b,-12,-14,f1x-4,f1y-9);hose(8,-24+b,12,-14,f2x-4,f2y-9);shoe(f1x,f1y);shoe(f2x,f2y);
  ctx.translate(0,b);ctx.rotate(o.dash?.38:o.run?.08:0);
  const sw=o.run?Math.sin(ph)*10:Math.sin(tq*9)*2;
  hose(-14,-58,-28,-52,-27-sw*.4,-40+sw*.3);glove(-27-sw*.4,-38+sw*.3,9);           // back arm
  const body=()=>{ctx.beginPath();ctx.moveTo(-18,-92);ctx.lineTo(18,-92);ctx.lineTo(18,-54);ctx.bezierCurveTo(24,-48,46,-50,46,-34);ctx.bezierCurveTo(46,-18,20,-18,4,-20);ctx.bezierCurveTo(-14,-20,-21,-30,-18,-50);ctx.closePath()};
  body();ctx.fillStyle=col;ctx.fill();
  ctx.save();body();ctx.clip();ctx.fillStyle=CREAM;ctx.fillRect(-22,-94,44,13);ctx.beginPath();ctx.ellipse(41,-32,13,13,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(-16,-24,11,10,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(27,20,16,.22)';ctx.fillRect(-22,-81,44,3);ctx.restore();
  body();ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.stroke();
  const blink=((t+(o.ph||0)*1.3)%3.1)<.12;
  if(o.hurt){for(const ex of[-3,11]){line(ex-5,-71,ex+4,-66,3.5);line(ex-5,-61,ex+4,-66,3.5)}ell(5,-52,5,6,'#6b1f1c',3.5)}
  else if(o.scared){const lk=Math.sin(t*2.4)>0?0:Math.PI;pieEye(-3,-67,7,11,lk);pieEye(11,-67,7,11,lk);line(-8,-81,0,-78,3);line(16,-81,8,-78,3);ell(5,-52,4,5.5,'#6b1f1c',3)}
  else{pieEye(-3,-66,6.5,10,0,blink);pieEye(11,-66,6.5,10,0,blink);
    if(o.shoot||o.happy){ctx.beginPath();ctx.arc(5,-54,8,.05*Math.PI,.95*Math.PI);ctx.closePath();ctx.fillStyle='#6b1f1c';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=INK;ctx.stroke()}
    else{ctx.beginPath();ctx.arc(5,-56,7,.15*Math.PI,.85*Math.PI);ctx.lineWidth=3.5;ctx.strokeStyle=INK;ctx.stroke()}}
  if(o.shoot){hose(13,-58,26,-62,40,-57);glove(42,-57,9);line(49,-58,56,-58,4)}        // finger-gun arm
  else{hose(13,-58,28,-52,27+sw*.4,-40-sw*.3);glove(27+sw*.4,-38-sw*.3,9)}
  ctx.restore();
}
function drawBaron(x,y,sc,o={}){
  const b=Math.sin(tq*5)*4,m=o.mouth||0,tele=o.st==='tongue'&&o.el<.95,blink=(t%3.6)<.12;
  ctx.save();ctx.translate(x+bj(1),y+bj(2));ctx.scale(sc,sc);
  if(tele)ctx.scale(1+Math.sin(t*40)*.03,1+Math.cos(t*40)*.03);
  ell(-66,-26,40,27,DKGREEN,5);ell(70,-26,40,27,DKGREEN,5);ell(-92,-7,30,10,GREEN,5);ell(96,-7,30,10,GREEN,5);
  ell(0,-72+b,90,74,GREEN,6);ell(-4,-48+b,58,42,CREAM,0);
  ell(52,-102+b,9,7,DKGREEN,0);ell(66,-76+b,6,5,DKGREEN,0);ell(40,-124+b,5,4,DKGREEN,0);
  hose(-74,-66+b,-102,-58,-104,-38+b);line(-106,-58+b,-112,-2,9);line(-106,-58+b,-112,-2,4,'#c99a5b');ctx.beginPath();ctx.arc(-96,-58+b,10,Math.PI,0);ctx.lineCap='round';ctx.strokeStyle=INK;ctx.lineWidth=9;ctx.stroke();ctx.strokeStyle='#c99a5b';ctx.lineWidth=4;ctx.stroke();glove(-104,-36+b,12);hose(76,-62+b,98,-48,90,-32+b);glove(90,-30+b,12);
  poly([0,-26+b,-22,-38+b,-22,-12+b],RED,4);poly([0,-26+b,22,-38+b,22,-12+b],RED,4);ell(0,-26+b,6,6,RED,4);
  ctx.save();ctx.translate(4,-172+b);ctx.rotate(.06);ell(0,-16,24,22,RED,5);ell(0,4,48,19,WHITE,5);ctx.strokeStyle='rgba(27,20,16,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,30,46,3.75,5.67);ctx.stroke();ctx.beginPath();ctx.arc(0,40,52,3.95,5.47);ctx.stroke();ctx.restore();
  for(const sx of[-40,40]){ell(sx,-134+b,30,30,GREEN,6);if(o.dead)dizzy(sx-4,-136+b,19);else pieEye(sx-4,-136+b,19,22,Math.PI,blink)}
      if(tele){ell(-72,-86+b,16,13,PINK,0);ell(60,-86+b,16,13,PINK,0)}
  if(m>.05||o.dead||(o.tongue||0)>0){const mm=Math.max(m,.35);ell(-8,-84+b,58,6+mm*32,'#6b1f1c',5);ell(-8,-74+b+mm*14,30,4+mm*11,PINK,0)}
  else{ctx.beginPath();ctx.moveTo(-68,-90+b);ctx.quadraticCurveTo(-8,-64+b,56,-90+b);ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.lineCap='round';ctx.stroke()}
  ctx.save();ctx.translate(-6,-101+b);ctx.fillStyle=INK;for(const d of[-1,1]){ctx.beginPath();ctx.moveTo(0,-2);ctx.bezierCurveTo(d*16,-14,d*40,-12,d*50,0);ctx.bezierCurveTo(d*56,6,d*64,-2,d*58,-12);ctx.bezierCurveTo(d*68,-2,d*62,14,d*46,10);ctx.bezierCurveTo(d*30,8,d*14,8,0,8);ctx.closePath();ctx.fill()}ctx.restore();
  ctx.restore();
}
function drawGranny(x,y,sc,o={}){
  const b=Math.sin(tq*5+1)*3,sh=o.st&&o.st!=='idle',wv=Math.sin(tq*(sh?16:5))*(sh?14:4);
  ctx.save();ctx.translate(x+bj(3),y+bj(4));ctx.scale(sc,sc);
  ell(-22,-6,22,10,PINK,5);ell(24,-6,22,10,PINK,5);ell(-36,-13,6,6,CREAM,3);ell(10,-13,6,6,CREAM,3);
  for(const f of[[-58,-150,34],[62,-146,34],[-36,-186,34],[40,-188,36],[2,-204,34],[0,-160,44]]){ell(f[0],f[1]+b,f[2],f[2],DKGREEN,6);ctx.beginPath();ctx.arc(f[0]-4,f[1]+b-4,f[2]*.55,3.4,4.9);ctx.strokeStyle='rgba(255,250,240,.3)';ctx.lineWidth=4;ctx.stroke()}
  line(-24,-270+b,20,-232+b,7);line(-24,-270+b,20,-232+b,3,MUST);line(28,-270+b,-16,-232+b,7);line(28,-270+b,-16,-232+b,3,MUST);
  ell(2,-246+b,22,20,DKGREEN,6);
  ctx.beginPath();ctx.moveTo(-36,-150+b);ctx.quadraticCurveTo(-52,-60,-44,-10);ctx.lineTo(44,-10);ctx.quadraticCurveTo(52,-60,36,-150+b);ctx.closePath();ctx.fillStyle='#b7d18a';ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.stroke();
  poly([-49,-78+b,0,-64+b,49,-78+b,42,-46+b,0,-26+b,-44,-46+b],PURPLE,5);ell(0,-62+b,6,6,MUST,3);
  hose(42,-70+b,72,-56,50,-40+b);glove(50,-38+b,11);
  line(-90,-118+b+wv,-104,-190+b+wv,9);line(-90,-118+b+wv,-104,-190+b+wv,4,'#c99a5b');ell(-106,-200+b+wv,13,17,'#c99a5b',4,-.2);
  hose(-42,-72+b,-78,-80,-90,-116+b+wv);glove(-90,-116+b+wv,11);
  for(const gx of[-19,17]){ell(gx,-112+b,17,17,'rgba(255,250,240,.9)',4);if(o.dead)dizzy(gx,-112+b,11);else ell(gx-3,-110+b,4.5,6,INK,0)}
  line(-2,-112+b,0,-112+b,4);
  line(-34,-140+b,-8,-131+b,5);line(32,-140+b,8,-131+b,5);
  ell(-32,-90+b,7,5,PINK,0);ell(30,-90+b,7,5,PINK,0);
  if(sh||o.dead)ell(-1,-84+b,12,9,'#6b1f1c',4);else{ctx.beginPath();ctx.arc(-1,-80+b,9,1.15*Math.PI,1.85*Math.PI);ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke()}
  ctx.restore();
}

  if(B.hp<=0){B.hp=0;B.dead=true;B.st='dead';B.tongue=0;P.wind=0;for(const h of haz)puff(h.x||0,h.y||0);haz.length=0;G.shake=.6;setState('win');sfx.win();
    for(let i=0;i<40;i++)fx.push({k:'conf',x:rnd(0,W),y:rnd(-200,-10),vx:rnd(-30,30),vy:rnd(120,260),col:pick([RED,MUST,TEAL,PINK,CREAM]),rot:rnd(0,6),life:4,max:4})}}

function updPlayer(dt){
  const p=P,mv=(keys.right?1:0)-(keys.left?1:0);p.mv=mv;
  if(p.dashT>0){p.dashT-=dt;p.vx=p.face*820;p.vy=0}else{p.vx=mv*330;if(mv)p.face=mv;p.vy+=2100*dt}
  p.dashCd-=dt;
  if(pressed.dash&&p.dashCd<=0&&p.dashT<=0){if(mv)p.face=mv;p.dashT=.2;p.dashCd=.55;sfx.dash();puff(p.x,p.y-30)}
  if(pressed.jump&&p.on&&p.dashT<=0){p.vy=-780;p.on=false;sfx.jump();puff(p.x,p.y-4,CREAM,3)}
  if(!keys.jump&&p.vy<-260&&p.dashT<=0)p.vy=-260;
  p.x=clamp(p.x+(p.vx+p.wind)*dt,30,W-30);p.y+=p.vy*dt;
  if(p.y>=GY){if(!p.on)puff(p.x,GY-4,CREAM,3);p.y=GY;p.vy=0;p.on=true}
  if(mv&&p.on)p.runT+=dt;

  if(G.state==='fight'){
    if(keys.shoot&&p.cd<=0&&p.dashT<=0){p.cd=.13;p.shootT=.14;shots.push({x:p.x+p.face*48,y:p.y-57+rnd(-4,4),vx:p.face*900,r:9,life:1.3});sfx.shoot()}
    if(pressed.super&&p.sup>=100){p.sup=0;p.shootT=.4;shots.push({x:p.x+p.face*60,y:p.y-70,vx:p.face*480,r:50,life:3.2,sup:true});sfx.sup();pop(p.x,p.y-140,U.supShout,STINK,30)}
  }

function updFight(dt){
  updPlayer(dt);B.upd(dt);
  const pb={x:P.x-14,y:P.y-76,w:28,h:72},bb=B.box();
  for(const s of shots){s.x+=s.vx*dt;s.life-=dt;if(s.life<=0||s.x<-90||s.x>W+90){s.dead=true;continue}

    for(const h of haz)if(h.pop&&!h.dead&&Math.hypot(h.x-s.x,h.y-s.y)<h.r+s.r){h.hp=(h.hp||1)-(s.sup?9:1);if(!s.sup)s.dead=true;if(h.hp<=0){h.dead=true;puff(h.x,h.y,WHITE);sfx.pop()}break}}
  if(G.state==='fight'){
    for(const h of haz){h.upd(dt);if(h.dead||h.safe||P.inv>0)continue;const r=h.rect?h.rect():null;
      if(h.rect?(r&&rectRect(r,pb)):circRect(h.x,h.y,h.r*.7,pb)){hurt();if(!h.rect&&!h.keep)h.dead=true}}
    if(G.state==='fight'&&rectRect(bb,pb)){hurt();if(B.y>=GY)P.x=Math.min(P.x,bb.x-12)}
  }

}
function updFx(dt){for(const f of fx){f.life-=dt;if(f.vx!==undefined){f.x+=f.vx*dt;f.y+=f.vy*dt}if(f.k==='text')f.y-=40*dt;if(f.k==='sock'){f.vy+=900*dt;f.rot+=f.vr*dt;if(f.y>GY-10&&f.vy>0){f.y=GY-10;f.vy*=-.45;f.vx*=.7}}if(f.k==='conf')f.rot+=4*dt}fx=fx.filter(f=>f.life>0)}

  else if(c.art){drawSock(W/2-52,190,1.25,{happy:true});drawSock(W/2+52,190,1.25,{col:BLUE,face:-1,happy:true,ph:2});ty=310}
  ctx.font=`600 ${size}px ${FB}`;const lines=wrap(c.text,tw),lh=size*1.6;let n=0;ctx.direction='rtl';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=col;
  lines.forEach((ln,i)=>{const part=ln.slice(0,Math.max(0,shown-n));n+=ln.length;if(part)ctx.fillText(part,tx,ty-(lines.length-1)*lh/2+i*lh)});
  G.full=shown>=n;
  if(G.full&&Math.floor(t*2.5)%2)label(U.next,112,H-66,21,MUST,{stroke:0});
  label(AR(G.ci+1)+' / '+AR(G.cards.length),W-100,H-66,15,'rgba(241,227,194,.55)',{stroke:0,body:1,w:600});
}
function drawTitle(){
  sunburst(W/2,H*.62,900,14,t*.12,MUST,'#edc56a');
  ctx.fillStyle='#a9925a';ctx.beginPath();ctx.ellipse(W/2,H+250,820,330,0,0,7);ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.stroke();
  drawKing(800,478,.72,{spin:t*3});drawGranny(676,470,.6,{});drawBaron(130,478,.62,{});
  drawSock(330,470,1.5,{happy:true});drawSock(420,470,1.3,{col:BLUE,face:-1,happy:true,ph:2});
  const w=Math.sin(tq*4)*.012;label('سوكو',W/2,112,138,RED,{rot:-.04+w,sh:7,stroke:20});
  ctx.save();ctx.translate(W/2,214);ctx.rotate(-.02);rr(-292,-30,584,60,10,INK,0);label('وسرقة الجوارب الكبرى',0,3,38,CREAM,{stroke:0});ctx.restore();
  label(U.sub,W/2,272,21,INK,{stroke:0,body:1,w:700});
  if(Math.floor(t*2.2)%2)label(isTouch?U.startT:U.startK,W/2,510,27,CREAM,{stroke:7});
}
function drawEnd(){
  sunburst(W/2,H*.55,900,14,t*.12,TEAL,'#55a39d');
  ctx.fillStyle='#a9925a';ctx.beginPath();ctx.ellipse(W/2,H+250,820,330,0,0,7);ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.stroke();
  drawBaron(140,476,.6,{});drawGranny(286,470,.58,{});drawKing(806,478,.68,{spin:t*3});
  drawSock(440,470,1.5,{happy:true,air:Math.sin(t*6)>.6});drawSock(540,470,1.5,{col:BLUE,face:-1,happy:true,ph:2});
  for(const f of fx)drawFx(f);
  label('النهاية',W/2,128,124,CREAM,{rot:-.03,sh:7,stroke:18});
  label(U.endSub,W/2,228,26,INK,{stroke:0,body:1,w:700});
  if(G.st>1&&Math.floor(t*2.2)%2)label(isTouch?U.againT:U.againK,W/2,510,25,CREAM,{stroke:7});
}
function banner(){
  const L=U.lv[G.lvl],s=G.st,a=clamp(s/.25,0,1)*clamp((2.3-s)/.25,0,1);ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle='rgba(23,17,13,.82)';ctx.fillRect(0,170,W,190);line(0,172,W,172,4,PAPER);line(0,358,W,358,4,PAPER);
  label(L.round,W/2,204,27,MUST,{stroke:0});label(L.title,W/2,262,60,CREAM,{sh:4,rot:-.015});
  if(s>1.25)label(s<1.75?U.ready:U.go,W/2,326,s<1.75?27:40,s<1.75?PAPER:RED,{stroke:s<1.75?0:9});
  ctx.restore();
  if(!isTouch&&s>.4){ctx.save();ctx.globalAlpha=a;label(U.holdX,W/2,396,23,CREAM,{stroke:7});ctx.restore()}
}
function overlayLose(){
  const L=U.lv[G.lvl],a=clamp(G.st/.4,0,1);ctx.fillStyle=`rgba(23,17,13,${.72*a})`;ctx.fillRect(0,0,W,H);if(a<1)return;
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-.02);rr(-300,-150,600,300,16,PAPER,7);
  label(U.lose,0,-92,56,RED,{sh:4});
  ctx.direction='rtl';ctx.font=`700 25px ${FB}`;ctx.fillStyle=INK;ctx.textAlign='center';ctx.textBaseline='middle';wrap('«'+L.taunt+'»',520).forEach((l,i)=>ctx.fillText(l,0,-30+i*36));
  label(L.tip,0,36,21,TEAL,{stroke:0,body:1,w:700});
  label(U.energy+AR(Math.ceil(B.hp/B.max*100))+'٪',0,72,19,INK,{stroke:0,body:1,w:600});
  if(Math.floor(t*2.5)%2)label(isTouch?U.retryT:U.retryK,0,116,24,INK,{stroke:0});
  ctx.restore();
}

/* ---------- main loop ---------- */
function update(dt){
  G.st+=dt;G.shake=Math.max(0,G.shake-dt);
  const s=G.state;
  if(s==='title'){if(pressed.confirm){sfx.tick();showCards(U.intro.concat(U.lv[0].pre),()=>startFight(0))}}
  else if(s==='cards'){if(pressed.skip){G.then();return}
    if(pressed.confirm){if(!G.full)G.st=99;else{sfx.tick();if(++G.ci>=G.cards.length)G.then();else{G.st=0;cardShown()}}}}
  else if(s==='intro'){updPlayer(dt);updFx(dt);if(G.st>2.3)setState('fight')}
  else if(s==='fight'){updFight(dt);updFx(dt)}
  else if(s==='win'){updPlayer(dt);updFight0(dt);updFx(dt);
    if(G.lvl===2&&Math.random()<dt*22)fx.push({k:'sock',x:B.x-10,y:B.y-100,vx:rnd(-520,-60),vy:rnd(-620,-200),vr:rnd(-8,8),rot:0,col:pick([RED,BLUE,MUST,PURPLE,PINK,TEAL]),life:3,max:3});
    if((G.st>1.3&&pressed.confirm)||G.st>4.2){const n=G.lvl;
      if(n<2)showCards(U.lv[n].post.concat(U.lv[n+1].pre),()=>startFight(n+1));else showCards(U.ending,()=>{fx=[];setState('end')})}}
  else if(s==='lose'){updFx(dt);if(G.st>.7&&pressed.confirm)startFight(G.lvl)}
  else if(s==='end'){updFx(dt);if(Math.random()<dt*8)fx.push({k:'conf',x:rnd(0,W),y:-10,vx:rnd(-30,30),vy:rnd(120,240),col:pick([RED,MUST,PINK,CREAM,BLUE]),rot:rnd(0,6),life:4,max:4});
    if(G.st>1&&pressed.confirm){fx=[];setState('title')}}
}
function updFight0(dt){for(const s of shots){s.x+=s.vx*dt;s.life-=dt;if(s.life<=0)s.dead=true}shots=shots.filter(s=>!s.dead)}
function render(){
  ctx.setTransform(S,0,0,S,0,0);ctx.direction='rtl';const s=G.state;
  if(s==='title')drawTitle();else if(s==='cards')drawCards();else if(s==='end')drawEnd();
  else if(s!=='boot'){scene();hud();if(s==='intro')banner();
    if(s==='win'){const k=Math.min(1,G.st/.3);label(G.lvl===2?U.winFinal:U.win,W/2,210,96*(1.4-.4*k),MUST,{rot:-.05+Math.sin(tq*6)*.02,sh:6,stroke:18})}
    if(s==='lose')overlayLose()}
  film();
  const inGame=s==='intro'||s==='fight'||s==='win';langBtn.hidden=!(s==='title'||s==='cards'||s==='end');padsEl.hidden=!(isTouch&&inGame);
  if(P)btnSuper.classList.toggle('ready',P.sup>=100&&s==='fight');
}
let last=0;
function frame(ts){const now=ts/1000,dt=Math.min(.033,Math.max(.001,now-last));last=now;t+=dt;tq=Math.floor(t*12)/12;boil=Math.floor(t*8);
  update(dt);render();pressed={};requestAnimationFrame(frame)}
function fit(){
  const th=document.getElementById('theater');helpEl.hidden=isTouch;
  const aw=th.clientWidth-32,ah=th.clientHeight-20-(isTouch?0:helpEl.offsetHeight+10);
  const w=Math.max(200,Math.min(aw,ah*16/9,1280));cv.style.width=w+'px';cv.style.height=(w*9/16)+'px';
  S=clamp(w*(window.devicePixelRatio||1)/W,1,2);cv.width=Math.round(W*S);cv.height=Math.round(H*S);
}
addEventListener('resize',fit);
function start(data){
  applyLang();BG=[mkBg(0),mkBg(1),mkBg(2)];mkFilm();fit();
  const h=(location.hash||'').match(/^#round([123])$/);
  if(h)startFight(+h[1]-1);else if(data&&data.inGame)startFight(data.lvl|0);else setState('title');
  requestAnimationFrame(ts=>{last=ts/1000;requestAnimationFrame(frame)});
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({lvl:G.lvl,inGame:G.state==='intro'||G.state==='fight'||G.state==='lose'}));
const boot=()=>{if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{})};
const fontsReady=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('30px Lalezar','سوكو Enter'),document.fonts.load('600 30px "Baloo Bhaijaan 2"','سوكو Enter'),document.fonts.load('700 30px "Baloo Bhaijaan 2"','سوكو')]):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,1800))]).then(boot,boot);
})();
</script>
